name: Refresh space weather
on: { schedule: [{ cron: '*/30 * * * *' }], workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-snapshots.mjs
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data/spaceweather.json
          git diff --cached --quiet || (git commit -m "Refresh space weather" && git push)
