<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Night Watch: Outpost Zero | NASA Space Apps</title>
<style>
:root{--bg:#05070d;--fg:#dbe4f5;--btn:#162035;--line:#3a4b75;--amber:#ffb84a;--cyan:#5ed3ff;--green:#62d68f;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;padding:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--fg);font-family:ui-monospace,monospace;user-select:none;-webkit-user-select:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#060814;display:block;touch-action:none;border-radius:4px;box-shadow:0 0 24px rgba(0,0,0,0.85)}

/* Nintendo-style Mobile Virtual Controller */
#pad{display:none;width:100%;max-width:440px;justify-content:space-between;align-items:center;padding:8px 18px 4px;box-sizing:border-box;touch-action:none}
.touch #pad{display:flex}
#dp{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:3px}
#dp button{background:#161d2d;color:var(--fg);border:2px solid var(--line);border-radius:10px;font-size:18px;touch-action:manipulation;min-width:52px;min-height:52px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #070a14}
#dp button:nth-child(1){grid-area:1/2}#dp button:nth-child(2){grid-area:2/1}#dp button:nth-child(3){grid-area:2/3}#dp button:nth-child(4){grid-area:3/2}
#dp button:active{background:#2a3652;transform:translateY(2px);box-shadow:0 1px 0 #070a14}

#ab{display:flex;gap:16px;align-items:center}
#ab button{border-radius:50%;width:68px;height:68px;font:bold 18px ui-monospace,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation;box-shadow:0 4px 0 #070a14}
#ab button small{display:block;font-size:8px;letter-spacing:.5px;margin-top:2px;opacity:.9}
#btn-x{background:#152238;color:var(--cyan);border:2px solid var(--cyan)}
#btn-z{background:#382710;color:var(--amber);border:2px solid var(--amber)}
#ab button:active{transform:translateY(2px);box-shadow:0 2px 0 #070a14}
#btn-x:active{background:#24395e}
#btn-z:active{background:#543b18}

@media (orientation:landscape) and (max-height:540px){
  .touch #pad{position:fixed;left:0;right:0;bottom:calc(6px + env(safe-area-inset-bottom,0px));max-width:none;padding:0 22px;pointer-events:none;justify-content:space-between}
  .touch #pad button{pointer-events:auto;opacity:.92}
}

#rep{display:none}
@media print{canvas,#pad{display:none!important}#rep{display:block;color:#000;background:#fff;font:14px Georgia,serif;padding:24px}html,body{overflow:visible;height:auto;background:#fff}}
</style>

<body>
<canvas id="c" aria-label="Night Watch: Outpost Zero Game Canvas"></canvas>
<div id="rep"></div>

<div id="pad">
  <div id="dp">
    <button data-k="u" aria-label="Up">▲</button>
    <button data-k="l" aria-label="Left">◀</button>
    <button data-k="r" aria-label="Right">▶</button>
    <button data-k="d" aria-label="Down">▼</button>
  </div>
  <div id="ab">
    <button id="btn-x" data-k="b" aria-label="X back">X<small>BACK</small></button>
    <button id="btn-z" data-k="a" aria-label="Z interact">Z<small>INTERACT</small></button>
  </div>
</div>
<input type="file" id="imp" accept="application/json,.json" hidden>

<script>
(()=>{
'use strict';
const W=240,H=160,T=16,cv=document.getElementById('c'),g=cv.getContext('2d');
cv.width=W;cv.height=H;

function fit(){
  const p=document.getElementById('pad');
  const land=innerWidth>innerHeight&&innerHeight<540;
  const ph=getComputedStyle(p).display!=='none'&&!land?p.offsetHeight+6:0;
  const s=Math.max(1,Math.floor(Math.min(innerWidth/W,(innerHeight-ph-8)/H)));
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';
}
const isT=matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints>0&&!matchMedia('(hover:hover)').matches);
if(isT)document.body.classList.add('touch');
addEventListener('touchstart',()=>{if(!document.body.classList.contains('touch')){document.body.classList.add('touch');fit()}},{once:true,passive:true});
addEventListener('resize',fit);fit();

// ==============================
// AUDIO SYSTEM (Retro 8-bit Synths)
// ==============================
let AC=null,muted=false;
function blip(f=440,d=.05,ty='square',v=.035){
  if(muted)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),a=AC.createGain(),t=AC.currentTime;
    o.type=ty;o.frequency.value=f;
    a.gain.setValueAtTime(v,t);
    a.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(a);a.connect(AC.destination);
    o.start(t);o.stop(t+d);
  }catch(e){}
}
function soundChime(){blip(523,.08,'sine',.04);setTimeout(()=>blip(659,.08,'sine',.04),70);setTimeout(()=>blip(784,.14,'sine',.04),140)}
function soundHiss(){blip(180,.12,'triangle',.05);setTimeout(()=>blip(120,.18,'sawtooth',.03),60)}
function soundFault(){blip(130,.18,'sawtooth',.06);setTimeout(()=>blip(95,.2,'sawtooth',.06),100)}

// ==============================
// DRAWING & MATH HELPERS
// ==============================
const C={
  bg:'#060814',reg:'#5a637a',sp:'#444e68',lt:'#7c88a4',wall:'#263048',wh:'#3d4c72',
  fl:'#181e30',am:'#ffb84a',cy:'#5ed3ff',rd:'#ff6b6b',gr:'#62d68f',wt:'#dbe4f5',
  dk:'#05070d',gold:'#ffcc00',pr:'#c792ff',blue:'#2e72d2'
};
const hash=(a,b)=>((a*73856093)^(b*19349663))>>>0;
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
function mb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function TX(s,x,y,c=C.wt,sz=8,al='left'){
  g.font=sz+'px "Press Start 2P",monospace';
  g.textBaseline='top';g.textAlign=al;g.fillStyle=c;
  g.fillText(s,Math.round(x),Math.round(y));
}
function disc(cx,cy,r,c){
  g.fillStyle=c;
  for(let y=-r;y<=r;y++){
    const w=Math.floor(Math.sqrt(Math.max(0,r*r-y*y)));
    g.fillRect(cx-w,cy+y,w*2,1);
  }
}
function tri(x,y,c=C.am,down=false){
  g.fillStyle=c;
  if(down){for(let i=0;i<4;i++)g.fillRect(x+i,y+i,7-i*2,1)}
  else{for(let i=0;i<4;i++)g.fillRect(x+i,y+i,1,7-i*2)}
}
function bar(x,y,w,v,c){
  R(x,y,w,4,'#05070d');
  R(x+1,y+1,Math.round((w-2)*clamp(v)/100),2,c||(v>50?C.gr:v>25?C.am:C.rd));
}
function wrap(s,n=26){
  const w=s.split(' ');const L=[];let c='';
  for(const x of w){if((c+' '+x).trim().length>n){L.push(c);c=x}else c=(c+' '+x).trim()}
  if(c)L.push(c);return L;
}
function pages(a,n=26){
  const P=[];
  for(const s of a){
    const L=wrap(s,n);
    for(let i=0;i<L.length;i+=3)P.push(L.slice(i,i+3));
  }
  return P;
}

// ==============================
// GAME STATE & CLOUD SAVING
// ==============================
function genCallsign(){
  const p=['ARTEMIS','ORION','APOLLO','EAGLE','VOYAGER','GATEWAY','POLARIS','TITAN','NOVA'];
  return p[Math.floor(Math.random()*p.length)]+'-'+(100+Math.floor(Math.random()*900));
}

const fresh=()=>({
  night:1,p:80,a:80,s:65,
  safety:0,honesty:0,curious:0,
  queue:[],talked:{},seen:{},dose:0,
  callsign:genCallsign(),
  spareKit:0,
  o2Mode:'BALANCED',
  waterPurged:false,
  cropsTended:false,
  cloudSynced:false
});

function fg(){return S.seen||(S.seen={})}
let S=fresh(),scene='title',t0=0,menu=0,dlg=null,tr=null,flash=false,floats=[],held={u:0,d:0,l:0,r:0};
let dayT=0;const DAY=48;let foot=[],motes=[],idleT=0,k=null,kmenu=0,last=0;
for(let i=0;i<26;i++)motes.push({x:Math.random()*W,y:Math.random()*H,v:2+Math.random()*5});
const stars=[];for(let i=0;i<75;i++)stars.push({x:Math.random()*W,y:Math.random()*110,p:Math.random()*6,l:1+(i%3)});

// Cloud + Local Save (Zero Login Required)
function save(notify=false){
  try{
    localStorage.setItem('nw-save',JSON.stringify({v:2,at:Date.now(),S}));
  }catch(e){}
  
  // Background Server Save
  if(S.callsign){
    fetch('save.php',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({callsign:S.callsign,data:S})
    }).then(r=>r.json()).then(res=>{
      if(res&&res.ok){
        S.cloudSynced=true;
        if(notify)floats.push({t:'CLOUD SAVED: '+S.callsign,x:30,y:50,c:C.gr,l:2.2});
      }
    }).catch(()=>{
      if(notify)floats.push({t:'LOCAL SAVED ('+S.callsign+')',x:30,y:50,c:C.cy,l:2});
    });
  } else if(notify){
    floats.push({t:'LOCAL SAVED',x:80,y:50,c:C.gr,l:1.8});
  }
  return 1;
}

function loadLocal(){
  try{
    const v=JSON.parse(localStorage.getItem('nw-save')||'null');
    if(!v)return null;
    const q=v.S||v;
    if(typeof q.night!=='number')return null;
    return Object.assign(fresh(),q);
  }catch(e){return null}
}

async function loadCloud(callsign){
  const cs=(callsign||'').trim().toUpperCase().replace(/[^A-Za-z0-9_-]/g,'');
  if(!cs)return false;
  try{
    const r=await fetch('save.php?id='+encodeURIComponent(cs));
    if(!r.ok)throw new Error('Not found');
    const j=await r.json();
    if(j&&j.ok&&j.save&&j.save.S){
      S=Object.assign(fresh(),j.save.S);
      S.callsign=cs;S.cloudSynced=true;
      save(false);
      return true;
    }
  }catch(e){}
  return false;
}

// ==============================
// FIELD GUIDE & CASE FILES
// ==============================
const CASES=[
  null,
  ['APOLLO 17 (1972)','Lunar dust clogged suit joints and smelled like gunpowder. Decon airlocks are vital.','NASA'],
  ['ARTEMIS I (2022)','Orion flew with sensor mannequins Helga & Zohar to measure lunar radiation doses.','NASA'],
  ['AUGUST 1972 STORM','A giant solar storm erupted between Apollo 16 and 17. Deep shelter protects crews.','NASA'],
  ['OPPORTUNITY (2018)','A planet-wide Mars dust storm blocked sunlight. Battery starvation ended the mission.','NASA'],
  ['CHANDRAYAAN-3 (2023)','India\'s lander worked a full lunar day at the south pole, then froze in the -170 C night.','ISRO'],
  ['CHANGE-4 (2019)','The far-side lander used a radioisotope heater unit (RHU) to survive the 14-day night.','CNSA'],
  ['ISS SOYUZ LEAK (2018)','A 2mm micro-hole caused pressure loss. Astronauts used ultrasound to seal it with epoxy.','NASA'],
  ['APOLLO 13 (1970)','Oxygen tank rupture! Crew rationed watts, built lithium hydroxide adapters to survive.','NASA'],
  ['MOXIE (2021+)','Perseverance rover instrument converted Martian atmospheric CO2 into breathable oxygen.','NASA'],
  ['ECLSS WATER RECYCLER','The ISS recycles 98% of human moisture and urine into ultrapure drinking water.','NASA'],
  ['VEGGIE EXPERIMENT','NASA astronauts grew red romaine lettuce and zinnia flowers in microgravity.','NASA'],
  ['ISRU FABRICATION','Artemis research into 3D-printing tools and spare parts from local lunar regolith.','NASA']
];

const FG=[
  ['MOONDUST','Regolith: razor-sharp electrostatic grit. It wears down seals.','.'],
  ['ROCK','Lunar boulders shield shadow zones where water ice can linger.','R'],
  ['SOLAR PANEL','Photovoltaic cells make power in sunlight. Night makes zero.','S'],
  ['BATTERY BANK','Stores daylight energy for base heaters and life support.','B'],
  ['AIRLOCK','Decontamination hatch between vacuum and the warm habitat.','D'],
  ['HAB FLOOR','Pressurized, temperature-controlled living module.','f'],
  ['WATER RECYCLER','ECLSS system recovers 98% of base moisture into pure water.','W'],
  ['O2 GENERATOR','Electrolyzer splits water into breathable oxygen gas.','O'],
  ['GREENHOUSE','Hydroponic Veggie bay: fresh food, CO2 absorption & crew morale.','G'],
  ['3D FABRICATOR','ISRU workshop prints replacement gears & seals from moon dust.','3'],
  ['BIO DOSIMETER','Monitors crew radiation exposure to keep within safe thresholds.','M'],
  ['CREW','Astronauts on Outpost Zero. Teamwork keeps the base alive.','']
];

const allG=()=>FG.map(x=>x[0]).concat(INC.map(x=>x[0]),CASES.slice(1).map(x=>x[0]));
function entry(n){
  const f=FG.find(x=>x[0]===n);if(f)return[f[1],'EQUIPMENT'];
  const ic=INC.find(x=>x[0]===n);if(ic)return[ic[3],'EMERGENCY LESSON'];
  const c=CASES.find(x=>x&&x[0]===n);if(c)return[c[1],'Src: '+c[2]];
  return['Classified Outpost telemetry.','MISSION DATA'];
}

// ==============================
// EXPANDED HABITAT MAP & CREW
// ==============================
// 15 cols x 10 rows. W:Water, O:O2, G:Greenhouse, 3:Fabricator, M:Medical, C:Console, D:Airlock
const MAP=[
  "..R...SSSSS..R.",
  "...............",
  "..BB.#########.",
  "..BB.#WffOffG#.",
  ".....#fffCfff#.",
  ".....#3ffMfff#.",
  ".....####D####.",
  ".......fffff...",
  ".R....ffffff.R.",
  ".....SSSSSS...."
];
const SOLID='#SBRCWOG3M';

const CREW=[
  {n:'ASHA',col:'#ff8a5b',c:8,r:3,b:[7,3,10,4],w:1,role:'Life Support Engineer'},
  {n:'RAVI',col:'#5ed3ff',c:7,r:5,b:[6,4,8,5],w:1,role:'Shielding Specialist'},
  {n:'MEI',col:'#62d68f',c:3,r:8,b:[1,7,13,9],w:1,role:'Field Geologist'},
  {n:'TOMAS',col:'#c792ff',c:12,r:4,b:null,w:0,sleep:1,role:'Payload Specialist'}
];

function lines(n){
  const q=S.night;
  if(n.n==='ASHA')return S.p<45?
    ["Power is dropping low! I shut down non-essential lighting.","The ECLSS water recycler hums when it's happy. Right now, it's shivering."]:
    ["14 days of night is a long freeze. Gary Crater is pitch black outside.","Life support runs on battery reserves. Every watt saved is air earned."];
  if(n.n==='RAVI')return S.s<40?
    ["The solar wind is kicking up regolith on the east ridge. Shielding is thin.","Check our dosimeters at the Medical station. Radiation never takes a break."]:
    ["Moondust smells like spent gunpowder. Apollo 17 astronauts reported the exact same thing!","Two independent sensors are better than one. Trust data, but verify."];
  if(n.n==='MEI')return[
    "I took the rover around Shackleton crater rim. Frozen carbon dioxide and water ice everywhere!",
    "Surface temperature is minus 170 C outside. Don't touch the airlock latch with bare gloves."
  ];
  if(q>=2&&!S.talked.speak){
    S.talked.speak=1;S.honesty++;
    return[
      "Oh! I'm awake! Totally awake, Duty Officer.",
      "My suit glove leaked dust on my last EVA. I reported it on the log.",
      "Speaking up about small leaks prevents catastrophic blowouts. (HONESTY +1)"
    ];
  }
  return["...mm... five more minutes...","Zzz... Bunk thermal blanket is warm..."];
}

// ==============================
// WORLD & INTERACTIVE MACHINES
// ==============================
const pl={c:9,r:5,tc:9,tr:5,mv:0,dir:'u',fr:0,bump:0};
const D_DIR={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};

function solid(c,r,self){
  if(c<0||r<0||c>=15||r>=10)return true;
  if(SOLID.includes(MAP[r][c]))return true;
  if(CREW.some(n=>n!==self&&((n.c===c&&n.r===r)||(n.tc===c&&n.tr===r))))return true;
  if(self&&((pl.c===c&&pl.r===r)||(pl.tc===c&&pl.tr===r)))return true;
  return false;
}

function startDay(){
  dayT=0;nextInc=10+Math.random()*15;incDone=0;foot=[];
  pl.c=pl.tc=9;pl.r=pl.tr=5;pl.mv=0;pl.dir='d';idleT=0;
  S.waterPurged=false;S.cropsTended=false;
  CREW.forEach((n,i)=>{n.tc=n.c;n.tr=n.r;n.t=1;n.nt=1+Math.random()*2});
  scene='world';
  save();
}

function interact(){
  const[dx,dy]=D_DIR[pl.dir],c=pl.c+dx,r=pl.r+dy;
  const n=CREW.find(n=>n.c===c&&n.r===r);
  if(n)return talk(n);

  if(r>=0&&r<10&&c>=0&&c<15){
    const ch=MAP[r][c];
    
    // Command Console
    if(ch==='C'){
      fg()['COMMAND CONSOLE']=1;
      return say([
        "CENTRAL COMMAND & NOAA TERMINAL",
        "Space Weather: "+wxShort()+". Sunlight remaining: "+Math.max(0,Math.round(DAY-dayT))+"s.",
        "When ready, initiate the Night Watch."
      ],()=>ask("Switch base to 14-night NIGHT WATCH now?",()=>startNight(),null),'CONSOLE');
    }

    // ECLSS Water Recycler
    if(ch==='W'){
      fg()['WATER RECYCLER']=1;
      if(S.waterPurged){
        return say(["ECLSS WATER RECYCLER","Filters: 100% PURGED & OPTIMAL.","NASA Fact: ISS recycles 98% of all water from sweat, breath & moisture."],null,'RECYCLER');
      }
      return say([
        "ECLSS WATER RECOVERY SYSTEM",
        "Filters are collecting moisture grit. Purging takes 4 Power but boosts Air by +6.",
        "NASA Fact: On the Moon, every drop of recycled water saves thousands in cargo resupply!"
      ],()=>ask("Cycle & Purge Water Filters? (-4 PWR, +6 AIR)",()=>{
        applyFx({p:-4,a:6});S.waterPurged=true;S.safety++;soundHiss();
        say(["Filter cycle complete! Air scrubbers refreshed with clean moisture."],null,'RECYCLER');
      },null),'RECYCLER');
    }

    // ECLSS OGA Oxygen Generator
    if(ch==='O'){
      fg()['O2 GENERATOR']=1;
      const modes=['BALANCED','BOOST','ECO'];
      const nextM=modes[(modes.indexOf(S.o2Mode)+1)%modes.length];
      return say([
        "ECLSS OGA OXYGEN GENERATOR (MOXIE)",
        "Current Output: "+S.o2Mode+". Splits water into breathable O2 using electrolysis.",
        "BOOST gives extra air for night, but burns power. ECO saves power when batteries are low."
      ],()=>ask("Switch mode to "+nextM+"?",()=>{
        S.o2Mode=nextM;blip(740,.08);
        if(S.o2Mode==='BOOST')applyFx({p:-6,a:8});
        if(S.o2Mode==='ECO')applyFx({p:6,a:-4});
        say(["O2 Generator adjusted to "+S.o2Mode+" mode."],null,'O2 ASSEMBLY');
      },null),'O2 ASSEMBLY');
    }

    // Hydroponic Greenhouse Bay
    if(ch==='G'){
      fg()['GREENHOUSE']=1;
      if(S.cropsTended){
        return say(["VEGGIE HYDROPONIC BAY","Crops are thriving under pink LED grow lights. Lettuce leaves look crisp!"],null,'GREENHOUSE');
      }
      return say([
        "VEGGIE HYDROPONIC BAY (APH)",
        "Dwarf wheat and radishes absorb crew CO2 and produce fresh oxygen buffer.",
        "Tending crops uses 2 Power, but restores +4 Air and lifts crew morale."
      ],()=>ask("Water & Tend Crops? (-2 PWR, +4 AIR, +1 Morale)",()=>{
        applyFx({p:-2,a:4});S.cropsTended=true;S.safety++;soundChime();
        say(["Crops tended! Fresh oxygen boost and crew morale lifted."],null,'GREENHOUSE');
      },null),'GREENHOUSE');
    }

    // ISRU 3D Regolith Fabricator
    if(ch==='3'){
      fg()['3D FABRICATOR']=1;
      if(S.spareKit>0){
        return say([
          "ISRU 3D REGOLITH FABRICATOR",
          "Spare Kit Ready in Storage (1/1).",
          "This kit automatically protects against rover motor faults and hull leaks!"
        ],null,'3D WORKSHOP');
      }
      return say([
        "ISRU 3D REGOLITH FABRICATOR",
        "Prints replacement rover gears & seal patches from raw lunar soil + resin.",
        "Costs 5 Power to print 1 Emergency Spare Kit for sudden breakdowns."
      ],()=>ask("Print Emergency Spare Kit? (-5 PWR)",()=>{
        applyFx({p:-5});S.spareKit=1;S.curious++;blip(920,.12);
        say(["Emergency 3D Spare Kit printed and loaded into base inventory!"],null,'3D WORKSHOP');
      },null),'3D WORKSHOP');
    }

    // Bio-Dosimetry & Medical Station
    if(ch==='M'){
      fg()['BIO DOSIMETER']=1;
      const dose=(S.dose||0).toFixed(1);
      return say([
        "BIO-DOSIMETRY & CREW VITALS",
        "Cumulative Crew Dose: "+dose+" mSv (Safe range <20 mSv/yr). Base Shield: "+S.s+"%.",
        "NASA Fact: Artemis astronauts wear active dosimeters to track solar cosmic radiation."
      ],null,'BIO-MONITOR');
    }

    // Solar panels / batteries / airlock / rocks
    const e=FG.find(x=>x[2]&&x[2]===ch);
    if(e){
      const sn=fg();
      if(!sn[e[0]]){
        sn[e[0]]=1;S.curious++;blip(1200,.12,'sine');
        return say(['SCAN: '+e[0],e[1],'Added to FIELD GUIDE.'],null,'SCANNER');
      }
      return say([e[1]]);
    }
  }
  say(["Lunar regolith. Fine, basaltic moondust. It clings to everything."]);
}

function talk(n){
  S.talked[n.n]=1;fg()['CREW']=1;S.curious=Object.keys(S.talked).length;
  const L=lines(n);const pick=L[(S.night+n.n.length)%L.length];
  n.dir={u:'d',d:'u',l:'r',r:'l'}[pl.dir];
  say(n.sleep&&L.length>2&&!S.talked.speakDone?L:[pick],null,n.n+' ('+n.role+')');
  if(L.length>2)S.talked.speakDone=1;

function updWorld(dt){
  if(yn||scene!=='world')return;
  dayT+=dt;idleT+=dt;
  if(!incDone&&dayT>nextInc&&!dlg&&!tr){incDone=1;triggerInc()}
  if(!dlg&&!tr){
    if(!pl.mv){
      const d=['u','d','l','r'].find(x=>held[x]);
      if(d){
        pl.dir=d;idleT=0;const[dx,dy]=D_DIR[d],nc=pl.c+dx,nr=pl.r+dy;
        if(!solid(nc,nr,null)){
          pl.tc=nc;pl.tr=nr;pl.mv=.001;
          if(MAP[pl.r][pl.c]==='.'&&foot.length<90){
            foot.push({x:pl.c*T+4+Math.random()*6,y:pl.r*T+10});
          }
          if(MAP[nr]&&MAP[nr][nc]==='D')soundHiss(); // airlock cycle hiss
        }else if(!pl.bump){
          pl.bump=.14;blip(110,.05,'triangle');
        }
      }
    }else{
      pl.mv+=dt*7.5;
      if(pl.mv>=1){
        pl.c=pl.tc;pl.r=pl.tr;pl.mv=0;pl.fr^=1;
        blip(pl.fr?180:150,.03,'triangle',.015);
        for(let i=0;i<3;i++)puffs.push({x:pl.c*T+8+Math.random()*4,y:pl.r*T+14,vx:(Math.random()-.5)*14,vy:-4-Math.random()*6,l:.5});
      }
    }
    pl.bump=Math.max(0,pl.bump-dt);
    if(idleT>5&&Math.floor(idleT*1.2)%3===0)pl.dir=['d','l','d','r'][Math.floor(idleT*1.2/3)%4];
    
    CREW.forEach(n=>{
      if(!n.w)return;
      n.nt-=dt;
      if(n.t<1){n.t+=dt*5;if(n.t>=1){n.c=n.tc;n.r=n.tr}}
      else if(n.nt<=0){
        n.nt=1.5+Math.random()*2.5;
        const d=['u','d','l','r'][Math.floor(Math.random()*4)],[dx,dy]=D_DIR[d],c=n.c+dx,r=n.r+dy;
        n.dir=d;
        if(c>=n.b[0]&&c<=n.b[2]&&r>=n.b[1]&&r<=n.b[3]&&!solid(c,r,n)){n.tc=c;n.tr=r;n.t=0}
      }
    });

    if(dayT>=DAY){
      say([
        "The sun dips below the polar ridge. Solar arrays output: ZERO.",
        "Lunar night has begun: minus 170 C for the next 14 nights. Time for the watch."
      ],()=>ask("Switch the outpost to NIGHT WATCH mode now?",()=>startNight(),()=>{
        dayT=DAY-18;
        say(["Standby granted. 18 more seconds of emergency battery reserve."],null,'RADIO');
      }),'MISSION CLOCK');
    }
  }
}

  // Levitated Dust Motes (Solar Wind > 400 km/s causes electrostatic levitation)
  const e=WXe();

  const kq=e.kp||0;

  hud();
}

const KN=[
  null,

];

function genK(n){
  const r=mb(n*977),nm=['MEI','RAVI','ASHA','TOMAS'][Math.floor(r()*4)],dose=10+Math.floor(r()*80);
  return{
    n:nm,ox:15+Math.floor(r()*75),dose,dust:10+Math.floor(r()*80),temp:-30-Math.floor(r()*40),
    glitch:r()<.3?1:0,fake:Math.min(99,dose+40),
    intro:nm+" (radio): Night "+n+" watch, Duty Officer. Knock knock. Can you read my suit telemetry?",
    earth:"Cross-check strange sensor spikes. Never act blindly on a single noisy telemetry reading."
  };
}
for(let i=4;i<=14;i++)KN[i]=genK(i);

function startNight(){
  k=Object.assign({wait:0,known:0,asked:0,checked:0,t:0,clk:0},KN[S.night]);
  if(S.night>3)k.dose=clamp(Math.round(k.dose*(.7+.3*RM())),5,99);
  kmenu=0;
  tr={t:0,d:1,fn:()=>{
    scene='knock';shake=.5;
    [0,.14,.28].forEach(d=>setTimeout(()=>blip(95,.09,'triangle',.07),d*1000));
    setTimeout(()=>say([wxLine(),k.intro],null,'RADIO'),700);
  }};
}

const OPTS=['OPEN AIRLOCK','DUST-OFF','STORM SHELTER','ASK EARTH','CROSS-CHECK'];
function fxs(f){return[f.p&&(f.p>0?'+':'')+f.p+' PWR',f.a&&(f.a>0?'+':'')+f.a+' AIR',f.s&&(f.s>0?'+':'')+f.s+' SHD'].filter(Boolean).join('  ')}

function applyFx(f){
  S.p=clamp(S.p+(f.p||0));S.a=clamp(S.a+(f.a||0));S.s=clamp(S.s+(f.s||0));
  if(f.p)floats.push({t:'PWR '+(f.p>0?'+':'')+f.p,x:104,y:14,c:f.p>0?C.gr:C.rd,l:1.6});
  if(f.a)floats.push({t:'AIR '+(f.a>0?'+':'')+f.a,x:104,y:24,c:f.a>0?C.gr:C.rd,l:1.6});
  if(f.s)floats.push({t:'SHD '+(f.s>0?'+':'')+f.s,x:104,y:34,c:f.s>0?C.gr:C.rd,l:1.6});
}

function choose(i){
  if(k.wait>0)return;
  if(i===4){
    if(k.checked)return say(["Already cross-checked. Readings are confirmed."]);
    k.checked=1;k.known=1;applyFx({p:-5});S.curious++;
    return say(["Cross-checking secondary dosimeter. Power -5.",k.glitch?"The primary badge suffered a sensor glitch! Real dose is "+k.dose+" mSv.":"Both sensors confirm matching radiation levels."],null,'DIAGNOSTIC');
  }
  if(i===3){
    if(k.asked)return say(["Earth Mission Control already replied."]);
    k.asked=1;k.wait=2.6;applyFx({p:-3});S.curious++;blip(900,.2,'sine');return;
  }
  const f={p:0,a:0,s:0},tx=[];let del=null;
  if(i===0){
    f.a-=8;tx.push("Airlock cycles: TSSHH... CLANK. Air -8.");
    if(k.dust>60){
      tx.push(k.n+" tracks sharp regolith across the deck.");
      del={t:"Moondust clogged habitat intake filters.",f:{p:-12,a:-4,s:0}};
    }
    if(k.ox<30){tx.push(k.n+" gulps fresh habitat oxygen just in time!");S.safety++}
    if(k.dose>60){
      f.s-=10;tx.push("Radiation residue detected. Habitability shield degrades.");
      del={t:"High exterior dose degraded base shielding.",f:{p:-6,a:0,s:-8}};
    }
  }
  if(i===1){
    f.p-=10;tx.push("High-pressure CO2 air-knives blast off dust. Power -10.");
    if(k.ox<30){
      tx.push(k.n+"'s oxygen dropped dangerously low while waiting outside!");
      S.safety--;del={t:k.n+" required extra oxygen recovery.",f:{p:-4,a:-12,s:0}};
    }else{
      tx.push("Habitat interior stays clean and airtight.");
    }
  }
  if(i===2){
    f.p-=6;f.a-=5;f.s+=8;tx.push("Heavy regolith vault shelter activated. Power -6, Air -5, Shield +8.");
    if(k.dose>60){tx.push("Crew is protected from solar storm. Good call!");S.safety++}
    if(k.ox<30){
      tx.push("Tight quarters strained life support reserves.");
      S.safety--;del={t:k.n+" consumed extra emergency O2.",f:{p:0,a:-10,s:0}};
    }
  }
  const label=OPTS[i];S.dose=(S.dose||0)+(i===2?1:k.dose/10);
  applyFx(f);
  if(del)S.queue.push({due:S.night+1,t:del.t,f:del.f,label,n:S.night});

function press(kk){
  if(tr)return;
  if(!AC)blip(1,.001);

  if(dlg){if(kk==='a'||kk==='b')dlgPress();return}
  if(yn){
    if(kk==='u'||kk==='d'||kk==='l'||kk==='r'){yn.sel^=1;blip(520,.03)}
    if(kk==='a'){const f=yn.sel?yn.no:yn.yes;yn=null;blip(760,.05);if(f)f()}
    return;
  }

  if(scene==='title'){
    if(kk==='u'||kk==='d'){menu=(menu+(kk==='d'?1:3))%4;blip(520,.04)}
    if(kk==='a'){
      // Import file
      if(menu===3){document.getElementById('imp').click();return}
      // Load by Callsign (Zero Login)
      if(menu===2){
        const cs=prompt("Enter Outpost Call Sign (e.g. ARTEMIS-409):");
        if(cs){
          loadCloud(cs).then(ok=>{
            if(ok){
              soundChime();
              tr={t:0,d:1,fn:()=>{
                startDay();
                say(["Welcome back, Duty Officer. Mission "+S.callsign+" restored from cloud!"],null,'MISSION CONTROL');
              }};
            }else{
              alert("Could not find mission with Call Sign: "+cs);
            }
          });
        }
        return;
      }
      const sv=loadLocal();
      if(menu===1&&!sv){blip(120,.1);return}
      S=menu===1?sv:fresh();
      blip(880,.08);
      tr={t:0,d:1,fn:()=>{
        if(menu===0)return startIntro();
        startDay();
        say(["Welcome back to Outpost Zero, Duty Officer. Call Sign: "+S.callsign],null,'CMDR');
      }};
    }
  }
  else if(scene==='world'){
    if(kk==='a')interact();
    if(kk==='b'){scene='menu';menu2=0;blip(700,.05)}
  }
  else if(scene==='mini'){miniPress(kk)}
  else if(scene==='menu'){
    if(kk==='u'||kk==='d'){menu2=(menu2+(kk==='d'?1:MENU.length-1))%MENU.length;blip(520,.03)}
    if(kk==='b')scene='world';
    if(kk==='a'){
      blip(760,.05);
      if(menu2===3){save(true);scene='world'}
      else if(menu2===4){exportSave();scene='world'}
      else scene=['guide','pass','data','world','world'][menu2];
      gi=0;
    }
  }
  else if(scene==='guide'){
    const n=allG().length;
    if(kk==='u'||kk==='d'){gi=(gi+(kk==='d'?1:n-1))%n;blip(520,.03)}
    if(kk==='b')scene='menu';
  }
  else if(scene==='pass'){
    if(kk==='a')printReport();
    if(kk==='b')scene='menu';
  }
  else if(scene==='data'){
    if(kk==='b')scene='menu';
    if(kk==='a'){wxMode=(wxMode+1)%5;blip(660,.05)}
  }
  else if(scene==='knock'){
    if(k.wait>0)return;
    if(kk==='u'||kk==='d'){kmenu=(kmenu+(kk==='d'?1:4))%5;blip(520,.03)}
    if(kk==='l'||kk==='r'){kmenu=kmenu<3?Math.min(kmenu+3,4):kmenu-3;blip(480,.03)}
    if(kk==='a'){blip(760,.05);choose(kmenu)}
  }
  else if(scene==='end'&&kk==='a'){
    S=fresh();menu=0;tr={t:0,d:1,fn:()=>{scene='title'}};
  }
}

function updMini(dt){
  if(!m.ready)return;
  m.t+=dt;const ty=m.ty;
  if(ty==='dust'||ty==='leak'){
    m.rp=(m.rp||0)-dt;
    if(m.rp<=0){
      const d=['u','d','l','r'].find(x=>held[x]);
      if(d){m.rp=.12;miniPress(d)}
    }
  }
  if(ty==='wire'&&m.ph===0){
    const q=(m.t-m.s0)/1.0;
    m.lit=q>=0&&q<m.seq.length&&q%1<.75?m.seq[Math.floor(q)]:null;
    if(q>=m.seq.length){m.ph=1;m.i=0;m.lit=null}
  }
  if(ty==='dust'){
    const i=m.cy*6+m.cx;
    if(m.w[i]<1){
      m.w[i]=Math.min(1,m.w[i]+dt*4.0);
      if(Math.random()<.3)blip(900+m.w[i]*400,.02,'triangle',.02);
    }
    if(m.w.every(v=>v>=1))miniEnd(1);
  }
  if(ty==='leak'){
    m.pr-=dt*1.4;
    const d=Math.abs(m.cx-m.hx)+Math.abs(m.cy-m.hy);
    m.vis[m.cy*6+m.cx]=d;
    // Proximity audio sonar
    if(Math.random()<(1-d/8)*dt*7)blip(450+(1-d/8)*750,.03,'sine',.03);
    if(m.pr<=0)miniEnd(0);
  }
  if(ty==='align'){
    m.x+=m.d*m.v*dt;
    if(m.x>194){m.x=194;m.d=-1}
    if(m.x<0){m.x=0;m.d=1}
  }
  if(m.t>m.T&&ty!=='leak')miniEnd(0);
}

        floats.push({t:'★ 3D SPARE USED!',x:70,y:10,c:C.cy,l:1.5});

        m.err++;soundFault();m.i=0;
        if(m.err>=5)miniEnd(0);
        else{m.ph=0;m.s0=m.t+.5}
      }
    }
  }

  // Dust Panels Sweep
  if(ty==='dust'&&mv){
    m.cx=clamp(m.cx+(kk==='r')-(kk==='l'),0,5);
    m.cy=clamp(m.cy+(kk==='d')-(kk==='u'),0,2);
    blip(420,.02);
  }

  // Air Leak Sonar Patch
  if(ty==='leak'){
    if(mv){
      m.cx=clamp(m.cx+(kk==='r')-(kk==='l'),0,5);
      m.cy=clamp(m.cy+(kk==='d')-(kk==='u'),0,3);
      blip(420,.02);
    }
    if(kk==='a'){
      if(m.cx===m.hx&&m.cy===m.hy){
        soundHiss();miniEnd(1);
      }else{
        m.pr-=4;soundFault();
        floats.push({t:'NO HOLE HERE',x:80,y:20,c:C.rd,l:.8});
      }
    }
  }

  // Dish Wave Alignment
  if(ty==='align'&&kk==='a'){
    if(m.x+2>=m.zone[0]&&m.x+2<=m.zone[1]){
      m.hits++;soundChime();m.v+=10;
      floats.push({t:'LOCKED ON!',x:90,y:20,c:C.gr,l:.9});
      const w=56-m.hits*8,a=20+Math.random()*130;
      m.zone=[a,a+w];
      if(m.hits>=3)miniEnd(1);
    }else{
      m.miss++;soundFault();
      if(m.miss>=5)miniEnd(0);
    }
  }
}

    if(m.w[m.cy*6+m.cx]<1&&Math.floor(t0*4)%2){
      disc(x+14,y+13,2,C.gold);
    }
    TX('SWEEP ALL PANELS: '+cleaned+'/18',120,128,C.cy,8,'center');
  }

  // 3. Air Leak Sonar Radar
  if(ty==='leak'){
    for(let i=0;i<24;i++){
      const x=36+(i%6)*28,y=30+Math.floor(i/6)*22;

      R(x,y,26,20,cCol);

    R(x-1,y-1,2,22,C.am);R(x+25,y-1,2,22,C.am);
    const d=Math.abs(m.cx-m.hx)+Math.abs(m.cy-m.hy);

  }

  // 4. Dish Signal Alignment
  if(ty==='align'){

      g.beginPath();g.arc(120,40,arcR,-Math.PI/3,Math.PI/3);g.stroke();

  // Start Instruction Card
  if(!m.ready){
    box(12,22,216,114);
    const H2={

    if(Math.floor(t0*2)%2)TX('PRESS Z TO BEGIN REPAIR',120,118,C.gr,8,'center');
  }
}

const NOAA='https://services.swpc.noaa.gov';
async function gj(u){
  const r=await fetch(NOAA+u,{signal:AbortSignal.timeout(6000)});
  if(!r.ok)throw 0;return r.json();
}
const sLv=p=>p>=1e5?5:p>=1e4?4:p>=1e3?3:p>=100?2:p>=10?1:0;
const rLv=f=>f>=2e-3?5:f>=1e-3?4:f>=1e-4?3:f>=5e-5?2:f>=1e-5?1:0;
const fcls=f=>{
  const L=f>=1e-4?'X':f>=1e-5?'M':f>=1e-6?'C':f>=1e-7?'B':'A';
  const b={X:1e-4,M:1e-5,C:1e-6,B:1e-7,A:1e-8}[L];
  return L+(f/b).toFixed(1);
};

function mkWx(o,badge,iso){
  const d=new Date(iso),p2=n=>String(n).padStart(2,'0');
  return{
    badge,
    when:badge==='LIVE'?p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())+' UTC':d.toISOString().slice(0,10),
    pfu:o.pfu,s:o.pfu==null?0:sLv(o.pfu),
    kp:o.kp,flare:o.flux?fcls(o.flux):'B5.0',
    r:o.flux?rLv(o.flux):0,
    wind:o.wind||365,
    note:'Live NOAA SWPC feeds: GOES-18 protons, real-time solar wind & planetary Kp index.'
  };
}

async function loadWx(){
  try{
    const[p,k,x,w]=await Promise.allSettled([
      gj('/json/goes/primary/integral-protons-6-hour.json'),
      gj('/json/planetary_k_index_1m.json'),
      gj('/json/goes/primary/xrays-6-hour.json'),
      gj('/products/summary/solar-wind-speed.json')
    ]);
    const o={pfu:null,kp:null,flux:null,wind:null};let t=0;
    if(p.status==='fulfilled'){
      const a=p.value.filter(q=>q.energy==='>=10 MeV'),q=a[a.length-1];
      if(q){o.pfu=+q.flux;t=Date.parse(q.time_tag)||0}
    }
    if(k.status==='fulfilled'){
      const q=k.value[k.value.length-1],v=Array.isArray(q)?q[1]:(q.estimated_kp??q.kp_index??q.kp);
      if(v!==null&&!isNaN(+v))o.kp=+v;
    }
    if(x.status==='fulfilled'){
      const a=x.value.filter(q=>String(q.energy).startsWith('0.1-0.8')),q=a[a.length-1];
      if(q)o.flux=+q.flux;
    }
    if(w.status==='fulfilled'&&Array.isArray(w.value)&&w.value[0]&&!isNaN(+w.value[0].proton_speed)){
      o.wind=+w.value[0].proton_speed;
    }
    if(o.pfu!=null||o.kp!=null){
      const fresh2=!t||Date.now()-t<7.2e6,iso=t?new Date(t).toISOString():new Date().toISOString();
      WX=mkWx(o,fresh2?'LIVE':'ARCHIVE',iso);
      try{localStorage.setItem('nw-wx',JSON.stringify({o,iso}))}catch(e){}
      return;
    }
  }catch(e){}

  // Local Snapshot Fallback
  try{
    const r=await fetch('data/spaceweather.json');
    if(r.ok){
      const c=await r.json();
      WX=mkWx(c,'ARCHIVE',c.fetchedAt||new Date().toISOString());
      return;
    }
  }catch(e){}
}

function WXe(){
  if(wxMode>0){

    return{
      badge:'SIMULATED',when:'PRACTICE STORM',

      flare:['M1.0','M5.0','X1.0','X10'][i],r:i+1,wind:520+i*110,
      note:'Practice Mode: Simulating extreme solar coronal mass ejection. Press Z to toggle.'
    };
  }
  return WX;
}

}

// MAIN GAME LOOP
// ==============================
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;t0+=dt;
  try{
    motes.forEach(o=>{o.x-=o.v*dt;o.y+=o.v*dt*.3;if(o.x<0)o.x=W;if(o.y>H)o.y=0});
    if(dlg&&!tr){
      dlg.ch+=dt*40;
      if(Math.floor(dlg.ch)%3===0&&dlg.ch<dlg.P[dlg.i].join('').length&&Math.random()<.5){
        blip(300+(dlg.who?dlg.who.length*40:0),.02,'square',.015);
      }
    }
    if(!tr&&!dlg||tr){
      if(scene==='world'&&!tr)updWorld(dt);
      if(scene==='knock'&&!tr)updKnock(dt);
    }
    if(tr){
      tr.t+=dt*3.2*tr.d;
      if(tr.d===1&&tr.t>=1){tr.t=1;tr.d=-1;tr.fn()}
      else if(tr.d===-1&&tr.t<=0)tr=null;
    }
    if(scene==='mini'&&!tr&&!dlg)updMini(dt);
    floats=floats.filter(f=>(f.l-=dt)>0);

    g.save();
    if(shake>0){
      shake-=dt;
      g.translate(Math.round((Math.random()-.5)*3),Math.round((Math.random()-.5)*3));
    }
    if(scene==='title')drawTitle();
    else if(scene==='world')drawWorld();
    else if(scene==='knock')drawKnock();
    else if(scene==='end')drawEnd();
    else if(scene==='menu')drawMenu();
    else if(scene==='mini')drawMini();
    else if(scene==='intro')drawIntro();
    else if(scene==='guide')drawGuide();
    else if(scene==='pass')drawPass();
    else if(scene==='data')drawData();

    if(flash){
      g.fillStyle='rgba(170,115,60,.32)';g.fillRect(0,0,W,H);
      R(0,(t0*70)%H,W,4,'#ffffff18');TX('<< REWIND',150,16,C.am,8);
    }
    floats.forEach(f=>TX(f.t,f.x+(scene==='knock'?60:0),f.y+(1.6-f.l)*-4+14,f.c,8));
    drawDlg();drawYN();

    if(tr){
      const f=Math.max(0,Math.min(1,tr.t));
      for(let i=0;i<8;i++)R(0,i*20,W,Math.ceil(20*f),'#000');
    }
    g.restore();
  }catch(err){
    g.fillStyle='#300';g.fillRect(0,0,W,H);
    TX('ERROR: '+String(err.message).slice(0,60),4,4,'#fff',8);
    console.error(err);
  }
  requestAnimationFrame(frame);
}

// Start
(document.fonts&&document.fonts.load?Promise.race([document.fonts.load('8px "Press Start 2P"'),new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(()=>{

  requestAnimationFrame(frame);
});
