 say(["Just moondust. It gets everywhere."])}

 else{pl.mv+=dt*7.5;if(pl.mv>=1){pl.c=pl.tc;pl.r=pl.tr;pl.mv=0;pl.fr^=1;blip(pl.fr?180:150,.03,'triangle',.02);for(let i=0;i<3;i++)puffs.push({x:pl.c*T+8+Math.random()*4,y:pl.r*T+14,vx:(Math.random()-.5)*14,vy:-4-Math.random()*6,l:.5})}}

}
